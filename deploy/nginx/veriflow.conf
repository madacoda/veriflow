# Install in /etc/nginx/sites-available/veriflow after obtaining the certificate.
# Cloudflare must use Full (strict) for this hostname before redirecting HTTP.
limit_req_zone $binary_remote_addr zone=veriflow_requests:10m rate=20r/s;
map "$request_method:$http_origin" $veriflow_cross_origin_write {
    default 1;
    ~^(GET|HEAD|OPTIONS): 0;
    ~^[A-Z]+:$ 0;
    ~^[A-Z]+:https://veriflow\.madacoda\.dev$ 0;
}
log_format veriflow '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name veriflow.madacoda.dev;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/veriflow-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://veriflow.madacoda.dev$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name veriflow.madacoda.dev;
    server_tokens off;

    # Browsers automatically resend Basic Auth; reject cross-origin mutations.
    if ($veriflow_cross_origin_write) { return 403; }

    ssl_certificate /etc/letsencrypt/live/veriflow.madacoda.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veriflow.madacoda.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:veriflow_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/veriflow.access.log veriflow;
    error_log /var/log/nginx/veriflow.error.log warn;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "private, no-store" always;

    # Gate the dashboard, API, artifacts and static assets together.
    auth_basic "Veriflow";
    auth_basic_user_file /etc/nginx/veriflow.htpasswd;
    client_max_body_size 12m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    limit_req zone=veriflow_requests burst=100 nodelay;
    limit_req_status 429;

    location / {
        proxy_pass http://127.0.0.1:1111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Do not pass the shared gate credential into the application.
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
